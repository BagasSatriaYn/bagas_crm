services:

  # ── 1. PHP Application ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: php_production
    container_name: bagas_crm_app
    restart: unless-stopped
    environment:
      APP_NAME: "PT. Smart CRM"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://localhost

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-bagas_crm}
      DB_USERNAME: ${DB_USERNAME:-crm_user}
      DB_PASSWORD: ${DB_PASSWORD:-crm_password}

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      LOG_CHANNEL: stack
      LOG_LEVEL: error
    volumes:
      - app_storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm_network

  # ── 2. MySQL Database ────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: bagas_crm_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bagas_crm}
      MYSQL_USER: ${DB_USERNAME:-crm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-crm_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  # ── 3. phpMyAdmin (Opsional – untuk lihat database) ──────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bagas_crm_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - crm_network

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  db_data:
    driver: local
  app_storage:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  crm_network:
    driver: bridge
